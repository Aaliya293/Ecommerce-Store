<!DOCTYPE html>
<html>
<head>
    <title>E-Commerce Store</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand" href="/">
            E-Commerce Store
        </a>

        <!-- Search Box -->
        <form method="GET" action="/" class="d-flex">

            <input
                type="text"
                name="q"
                class="form-control me-2"
                placeholder="Search Products">

            <button class="btn btn-light">
                Search
            </button>

        </form>

        <a href="{% url 'cart' %}" class="btn btn-warning ms-2">
            🛒 Cart
        </a>

        {% if user.is_authenticated %}

            <a href="{% url 'my_orders' %}" class="btn btn-info ms-2">
                My Orders
            </a>

            <a href="{% url 'logout' %}" class="btn btn-danger ms-2">
                Logout
            </a>

        {% else %}

            <a href="{% url 'login' %}" class="btn btn-light ms-2">
                Login
            </a>

            <a href="{% url 'register' %}" class="btn btn-success ms-2">
                Register
            </a>

        {% endif %}

    </div>

</nav>

<div class="container mt-4">

    {% block content %}

    {% endblock %}

</div>

<footer class="bg-dark text-white text-center p-3 mt-5">
    <p>© 2025 E-Commerce Store | Developed using Django</p>
</footer>

</body>
</html>
