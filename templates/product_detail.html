{% extends 'base.html' %}

{% block content %}

<div class="row">

    <div class="col-md-6">
        <img src="{{ product.image.url }}" class="img-fluid">
    </div>

    <div class="col-md-6">

        <h2>{{ product.name }}</h2>

        <h3 class="text-success">
            ₹ {{ product.price }}
        </h3>

        <p>{{ product.description }}</p>

        <h5>
            Stock: {{ product.stock }}
        </h5>

        <a href="{% url 'add_to_cart' product.id %}" class="btn btn-success">
            Add to Cart
        </a>

    </div>

</div>

{% endblock %}
